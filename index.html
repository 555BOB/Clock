<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F6;
    --ink: #14213D;
    --muted: #6B7690;
    --track: #D5DBE6;
    --brass: #B8860B;
    --flash: #F5C542;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14213D; --ink: #EEF1F6; --muted: #8E99B3; --track: #26355A; --brass: #E0A526; --flash: #3A4A72;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14213D; --ink: #EEF1F6; --muted: #8E99B3; --track: #26355A; --brass: #E0A526; --flash: #3A4A72;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    transition: background-color .6s ease;
  }
  body.chiming { background: var(--flash); transition: background-color .08s; }
  main {
    width: 100%; max-width: 30rem; padding: 1.5rem;
    display: flex; flex-direction: column; align-items: center; gap: 1.75rem;
  }
  .dial { position: relative; width: min(82vw, 22rem); aspect-ratio: 1; }
  @media (min-width: 700px) and (min-height: 700px) {
    main { max-width: 36rem; }
    .dial { width: min(70vw, 30rem); }
    body:not(.full) .time { font-size: 7rem; }
  }
  .ring { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .ring circle { fill: none; stroke-width: 6; }
  .analog { position: absolute; inset: 0; width: 100%; height: 100%; }
  .analog .tick { stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; }
  .analog .tick.major { stroke: var(--ink); stroke-width: 3.5; }
  .analog .hand { stroke: var(--ink); stroke-linecap: round; }
  .analog .sec { stroke: var(--brass); stroke-width: 1.6; stroke-linecap: round; }
  .analog .hub { fill: var(--brass); }
  .analog .hub-in { fill: var(--bg); }
  body:not(.analog-mode) .analog { display: none; }
  body.analog-mode .face, body.analog-mode .arc { display: none; }
  body.no-secs .sec, body.no-secs .hub-sec { display: none; }
  .seg { display: flex; border: 2px solid var(--ink); border-radius: 999px; padding: 2px; flex: none; }
  .seg button { border: 0; padding: .45rem .9rem; font-size: .95rem; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .exit-full {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    font-size: .9rem; padding: .55rem 1.1rem; opacity: .55;
  }
  .exit-full:hover, .exit-full:focus-visible { opacity: 1; }
  .exit-full { transition: opacity .3s ease; }
  body.full:not(.peek) .exit-full:not(:focus-visible) { opacity: 0; pointer-events: none; }
  body:not(.full) .exit-full { display: none; }
  body.full .controls, body.full .settings, body.full .note { display: none; }
  body.full main { max-width: none; padding: 0; }
  body.full .dial { width: min(92vw, 84vh); }
  body.full .time { font-size: clamp(4rem, min(22vw, 20vh), 11rem); }
  body.full .secs { font-size: clamp(1.25rem, min(5vw, 5vh), 2.4rem); }
  body.full { cursor: none; }
  body.full .exit-full { cursor: pointer; }
  .track { stroke: var(--track); }
  .arc { stroke: var(--brass); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
  .start {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
    background: var(--bg); padding: 1.5rem; text-align: center;
  }
  .start[hidden] { display: none; }
  .start button { font-size: 1.2rem; padding: 1rem 2rem; }
  .start p { color: var(--muted); margin: 0; max-width: 20rem; line-height: 1.5; }
  .face {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .time {
    font-size: clamp(3.4rem, 17vw, 5.2rem); font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1;
  }
  .secs { font-size: 1.25rem; font-weight: 300; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: .4rem; }
  body.no-secs .secs, body.no-secs .arc { display: none; }
  .settings {
    width: 100%; max-width: 22rem;
    display: flex; flex-direction: column; gap: 1rem;
    border-top: 2px solid var(--track); padding-top: 1.25rem;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .row-label { font-size: 1rem; }
  .row-label small { display: block; color: var(--muted); font-size: .85rem; margin-top: .15rem; }
  .switch {
    width: 3.2rem; height: 1.9rem; padding: 0; flex: none; position: relative;
    border-radius: 999px; border: 2px solid var(--ink);
  }
  .switch::after {
    content: ""; position: absolute; top: .2rem; left: .2rem;
    width: 1.2rem; height: 1.2rem; border-radius: 50%; background: var(--ink);
    transition: transform .15s ease;
  }
  .switch[aria-checked="true"] { background: var(--ink); }
  .switch[aria-checked="true"]::after { background: var(--bg); transform: translateX(1.3rem); }
  .stepper { display: flex; align-items: center; gap: .5rem; flex: none; }
  .stepper button { width: 2.6rem; height: 2.6rem; padding: 0; font-size: 1.3rem; line-height: 1; }
  .stepper button:disabled { opacity: .3; cursor: default; }
  .stepper output { min-width: 4.8rem; text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }
  .controls { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
  button {
    font: inherit; font-size: 1rem; font-weight: 500;
    padding: .8rem 1.4rem; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--ink); background: transparent; color: var(--ink);
  }
  button.primary { background: var(--ink); color: var(--bg); }
  button:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
  .note { font-size: .9rem; color: var(--muted); text-align: center; max-width: 24rem; line-height: 1.5; margin: 0; }
  @media (prefers-reduced-motion: reduce) {
    .arc, body, .switch::after { transition: none; }
  }
</style>
</head>
<body>
<div class="start" id="start">
  <button class="primary" id="startBtn">Start clock with sound</button>
  <p id="startMsg">Your browser needs one tap before it can play sound.</p>
</div>
<main>
  <div class="dial" aria-live="off">
    <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="92"/>
      <circle class="arc" id="arc" cx="100" cy="100" r="92"/>
    </svg>
    <svg class="analog" id="analog" viewBox="0 0 200 200" role="img" aria-label="Analogue clock">
      <g id="ticks"></g>
      <line class="hand" id="hourHand" x1="100" y1="108" x2="100" y2="54" stroke-width="6"/>
      <line class="hand" id="minHand" x1="100" y1="112" x2="100" y2="28" stroke-width="4"/>
      <line class="sec" id="secHand" x1="100" y1="120" x2="100" y2="20"/>
      <circle class="hub" cx="100" cy="100" r="5"/>
      <circle class="hub-in" cx="100" cy="100" r="1.8"/>
    </svg>
    <div class="face">
      <div class="time" id="time">--:--</div>
      <div class="secs" id="secs">--</div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="toggle" aria-pressed="false">Turn on chimes</button>
    <button id="test">Play test chime</button>
    <button id="onlyBtn">Clock only</button>
    <button id="fullBtn">Full screen</button>
  </div>

  <div class="settings">
    <div class="row">
      <span class="row-label" id="styleLabel">Clock style</span>
      <div class="seg" role="group" aria-labelledby="styleLabel">
        <button id="styleDigital" aria-pressed="true">Digital</button>
        <button id="styleAnalog" aria-pressed="false">Analogue</button>
      </div>
    </div>
    <div class="row">
      <span class="row-label" id="secsLabel">Show seconds</span>
      <button class="switch" id="secsSwitch" role="switch" aria-checked="true" aria-labelledby="secsLabel"></button>
    </div>
    <div class="row">
      <span class="row-label" id="earlyLabel">Chime early<small>Get a warning before meetings start</small></span>
      <div class="stepper" role="group" aria-labelledby="earlyLabel">
        <button id="earlyLess" aria-label="10 seconds less">−</button>
        <output id="earlyValue" aria-live="polite">On time</output>
        <button id="earlyMore" aria-label="10 seconds more">+</button>
      </div>
    </div>
  </div>

  <p class="note" id="note">Two chimes on the hour, one on the half hour. Keep this page open — chimes only play while it’s on screen.</p>
</main>
<button class="exit-full" id="exitFull">Show controls</button>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const arc = $('arc');
  const R = 92, C = 2 * Math.PI * R;
  arc.style.strokeDasharray = C;

  let on = false, lastKey = null, wakeLock = null, lastProgress = 0;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  let showSecs = store.get('showSecs', true);
  let analog = store.get('analog', false);
  let early = Math.min(120, Math.max(0, store.get('earlySecs', 0)));

  const pad = n => String(n).padStart(2, '0');

  // Build the chimes as real audio files so they play through the media channel
  // (Web Audio is silenced on iPhones when the ring/silent switch is on).
  function makeChime(notes) {
    const rate = 22050, gap = 1.6, ring = 8, fade = 2.5;
    const len = Math.floor(rate * (gap * (notes.length - 1) + ring));
    const mix = new Float32Array(len);
    // Church-bell tone: the uneven overtones of a cast bell (hum, prime,
    // minor-third "tierce", quint, nominal...), each fading at its own rate,
    // with a slight beating shimmer and a bright strike at the start.
    const partials = [
      [0.5, 0.55, 0.45], [1, 1, 0.8], [1.19, 0.55, 1.1], [1.5, 0.3, 1.4],
      [2, 0.65, 1.2], [2.52, 0.28, 2.2], [3.01, 0.2, 3], [4.07, 0.12, 4.2], [5.2, 0.08, 6]
    ];
    notes.forEach((freq, k) => {
      const off = Math.floor(k * gap * rate);
      for (let i = 0; i + off < len && i < ring * rate; i++) {
        const t = i / rate;
        const attack = Math.min(1, t / 0.004);
        // Gentle fade over the last few seconds so the bell dies away instead of cutting off.
        const left = ring - t;
        const release = left < fade ? 0.5 - 0.5 * Math.cos(Math.PI * left / fade) : 1;
        let v = 0;
        for (const [m, amp, decay] of partials) {
          const f = freq * m;
          v += amp * Math.exp(-t * decay) *
               (Math.sin(2 * Math.PI * f * t) + 0.5 * Math.sin(2 * Math.PI * (f + 0.8) * t));
        }
        v += 0.6 * Math.exp(-t * 40) * Math.sin(2 * Math.PI * freq * 6.8 * t);
        mix[off + i] += v * attack * release;
      }
    });
    let peak = 0;
    for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(mix[i]));
    const pcm = new Int16Array(len);
    for (let i = 0; i < len; i++) pcm[i] = mix[i] / peak * 0.7 * 32767;
    const buf = new ArrayBuffer(44 + pcm.length * 2), dv = new DataView(buf);
    const str = (o, x) => { for (let i = 0; i < x.length; i++) dv.setUint8(o + i, x.charCodeAt(i)); };
    str(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); str(8, 'WAVE');
    str(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    str(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
    new Int16Array(buf, 44).set(pcm);
    let bin = ''; const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    const samples = new Float32Array(len);
    for (let i = 0; i < len; i++) samples[i] = pcm[i] / 32768;
    return { uri: 'data:audio/wav;base64,' + btoa(bin), samples, rate };
  }

  const sounds = { 1: makeChime([440]), 2: makeChime([440, 440]) };

  // Two ways to play, so a chime still gets through if the iPad blocks one:
  // 1) one shared audio player, unlocked by a tap and reused for every chime;
  // 2) the browser's sound engine, kept awake by any tap on the page.
  const player = new Audio();
  player.preload = 'auto';
  let ctx = null, playerReady = false;

  function setSession() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  }

  // Call from inside a tap.
  function audio() {
    setSession();
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state !== 'running') ctx.resume().catch(() => {});
      const b = ctx.createBuffer(1, 1, 22050), src = ctx.createBufferSource();
      src.buffer = b; src.connect(ctx.destination); src.start(0);
    } catch (e) {}
  }

  function playEngine(count) {
    if (!ctx || ctx.state !== 'running') return false;
    const snd = sounds[count];
    const b = ctx.createBuffer(1, snd.samples.length, snd.rate);
    b.getChannelData(0).set(snd.samples);
    const src = ctx.createBufferSource();
    src.buffer = b; src.connect(ctx.destination); src.start();
    return true;
  }

  function soundBlocked() {
    $('startBtn').textContent = 'Turn sound back on';
    $('startMsg').textContent = 'Your iPad paused the sound. Tap once to bring the chimes back.';
    $('start').hidden = false;
  }

  function chime(count) {
    setSession();
    player.src = sounds[count].uri;
    player.currentTime = 0;
    const p = player.play();
    const fallback = () => { if (!playEngine(count)) soundBlocked(); };
    if (p) p.then(() => { playerReady = true; }).catch(e => { if (!(e && e.name === 'AbortError')) fallback(); });
    document.body.classList.add('chiming');
    setTimeout(() => document.body.classList.remove('chiming'), 400);
  }

  // Any tap keeps the sound unlocked.
  document.addEventListener('pointerdown', audio, true);

  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && on && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) { /* not supported or refused; clock still works */ }
  }

  async function setOn(value) {
    on = value;
    audio();
    $('toggle').textContent = on ? 'Turn off chimes' : 'Turn on chimes';
    $('toggle').setAttribute('aria-pressed', String(on));
    if (on) { lastKey = currentKey(chimeTime(new Date())); keepAwake(); }
    else if (wakeLock) { try { await wakeLock.release(); } catch (e) {} wakeLock = null; }
  }

  $('toggle').addEventListener('click', () => setOn(!on));
  $('startBtn').addEventListener('click', () => {
    $('start').hidden = true;
    audio();
    chime(1);
    if (!on) setOn(true);
  });

  $('test').addEventListener('click', () => chime(2));

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      keepAwake();
      if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
    }
  });

  // Analogue face: tick marks, then smooth hands driven every animation frame.
  (() => {
    const g = $('ticks'), NS = 'http://www.w3.org/2000/svg';
    for (let i = 0; i < 60; i++) {
      const major = i % 5 === 0, a = i * 6 * Math.PI / 180;
      const r1 = major ? 80 : 85, r2 = 89;
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', 100 + r1 * Math.sin(a)); l.setAttribute('y1', 100 - r1 * Math.cos(a));
      l.setAttribute('x2', 100 + r2 * Math.sin(a)); l.setAttribute('y2', 100 - r2 * Math.cos(a));
      l.setAttribute('class', major ? 'tick major' : 'tick');
      g.appendChild(l);
    }
  })();
  function drawHands() {
    if (analog) {
      const d = new Date();
      const sec = d.getSeconds() + d.getMilliseconds() / 1000;
      const min = d.getMinutes() + sec / 60;
      const hr = (d.getHours() % 12) + min / 60;
      $('secHand').setAttribute('transform', `rotate(${sec * 6} 100 100)`);
      $('minHand').setAttribute('transform', `rotate(${min * 6} 100 100)`);
      $('hourHand').setAttribute('transform', `rotate(${hr * 30} 100 100)`);
    }
    requestAnimationFrame(drawHands);
  }
  function applyStyle() {
    document.body.classList.toggle('analog-mode', analog);
    $('styleDigital').setAttribute('aria-pressed', String(!analog));
    $('styleAnalog').setAttribute('aria-pressed', String(analog));
  }
  $('styleDigital').addEventListener('click', () => { analog = false; store.set('analog', false); applyStyle(); });
  $('styleAnalog').addEventListener('click', () => { analog = true; store.set('analog', true); applyStyle(); });

  // Full screen: use the browser's full screen where allowed, and always hide the controls.
  let peekTimer = null;
  function peek() {
    document.body.classList.add('peek');
    clearTimeout(peekTimer);
    peekTimer = setTimeout(() => document.body.classList.remove('peek'), 4000);
  }
  document.addEventListener('pointerdown', e => {
    if (document.body.classList.contains('full') && e.target.id !== 'exitFull') peek();
  });
  function clockOnly() {
    document.body.classList.add('full');
    store.set('clockOnly', true);
    peek();
  }
  $('onlyBtn').addEventListener('click', clockOnly);

  function enterFull() {
    clockOnly();
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { try { const p = req.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  }
  function exitFull() {
    document.body.classList.remove('full');
    store.set('clockOnly', false);
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (fsEl && ex) { try { const p = ex.call(document); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  }
  $('fullBtn').addEventListener('click', enterFull);
  $('exitFull').addEventListener('click', exitFull);
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
    if (!(document.fullscreenElement || document.webkitFullscreenElement)) exitFull();
  }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') exitFull(); });

  function applySecs() {
    document.body.classList.toggle('no-secs', !showSecs);
    $('secsSwitch').setAttribute('aria-checked', String(showSecs));
  }
  $('secsSwitch').addEventListener('click', () => {
    showSecs = !showSecs; store.set('showSecs', showSecs); applySecs();
  });

  function earlyText(n) {
    if (n === 0) return 'On time';
    const m = Math.floor(n / 60), sec = n % 60;
    return [m ? `${m} min` : '', sec ? `${sec} s` : ''].filter(Boolean).join(' ');
  }
  function applyEarly() {
    $('earlyValue').textContent = earlyText(early);
    $('earlyLess').disabled = early <= 0;
    $('earlyMore').disabled = early >= 120;
  }
  function changeEarly(by) {
    early = Math.min(120, Math.max(0, early + by));
    store.set('earlySecs', early);
    lastKey = currentKey(chimeTime(new Date()));
    applyEarly();
  }
  $('earlyLess').addEventListener('click', () => changeEarly(-10));
  $('earlyMore').addEventListener('click', () => changeEarly(10));

  // The chime fires when the clock, pushed forward by the early setting, reaches :00 or :30.
  function chimeTime(d) { return new Date(d.getTime() + early * 1000); }

  function currentKey(d) {
    const m = d.getMinutes();
    return (m === 0 || m === 30) ? `${d.toDateString()} ${d.getHours()}:${m}` : null;
  }

  function tick() {
    const d = new Date();
    const h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
    $('time').textContent = `${pad(h)}:${pad(m)}`;
    $('secs').textContent = pad(s);

    const intoMinute = (s + d.getMilliseconds() / 1000) / 60;
    if (intoMinute < lastProgress) {
      arc.style.transition = 'none';
      arc.style.strokeDashoffset = C;
      arc.getBoundingClientRect();
      arc.style.transition = '';
    }
    arc.style.strokeDashoffset = C * (1 - intoMinute);
    lastProgress = intoMinute;

    const target = chimeTime(d);
    const key = currentKey(target);
    if (on && key && key !== lastKey) chime(target.getMinutes() === 0 ? 2 : 1);
    lastKey = key;
  }

  applySecs();
  applyEarly();
  applyStyle();
  if (store.get('clockOnly', false)) document.body.classList.add('full');
  requestAnimationFrame(drawHands);
  tick();
  setInterval(tick, 250);
})();
</script>

<script>
  // Offline support when hosted on your own site (ignored anywhere it isn't allowed).
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  }
</script>
</body>
</html>
